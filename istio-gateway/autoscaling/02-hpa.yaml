# ---------------------------------------------------------------
# HorizontalPodAutoscaler — all 9 microservices
# Trigger: actual CPU usage > 5m per pod → scale out
# (fake-service is too lightweight for a percentage-utilization demo target)
# Min: 1 replica  |  Max: 2 replicas
# ---------------------------------------------------------------

# ─────────────────────────────────────────────────────────────
# retail-banking-team
# ─────────────────────────────────────────────────────────────

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-profile-svc
  namespace: retail-banking-team
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-profile-svc
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue
        averageValue: 5m

---

