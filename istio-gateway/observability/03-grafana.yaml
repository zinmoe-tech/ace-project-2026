# ---------------------------------------------------------------
# Grafana — Live User Sessions & Service Health Dashboard
# Access: http://<EXTERNAL-IP>:3000   login: admin / admin
# Pre-provisioned dashboard: "HelloCloudBank - Live User Sessions"
# ---------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: "15s"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
    - name: HelloCloudBank
      folder: HelloCloudBank
      type: file
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sessions
  namespace: monitoring
data:
  sessions.json: |
    {
      "title": "HelloCloudBank - Live User Sessions",
      "uid": "hellocloudbank-sessions",
      "tags": ["istio", "live-sessions", "hellocloudbank"],
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Live Request Rate per Service (req/s)",
          "description": "Real-time HTTP request throughput per microservice. Spikes indicate active user sessions.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=~\"retail-banking-team|payments-team|grc-team\"}[1m])) by (destination_service_name)",
              "legendFormat": "{{ destination_service_name }}",
              "refId": "A"
            }
          ],
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["last", "max"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request Rate per Namespace (Team Activity)",
          "description": "Which banking team namespace is currently active. Correlates to active user sessions per team.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=~\"retail-banking-team|payments-team|grc-team\"}[1m])) by (destination_service_namespace)",
              "legendFormat": "{{ destination_service_namespace }}",
              "refId": "A"
            }
          ],
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["last", "max"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Auth Error Rate — 401 / 403 (JWT Failures)",
          "description": "401 = no/invalid JWT token. 403 = JWT valid but wrong group/namespace. Spikes mean unauthorized access attempts.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",response_code=~\"401|403\"}[1m])) by (destination_service_name, response_code)",
              "legendFormat": "{{ destination_service_name }} - HTTP {{ response_code }}",
              "refId": "A"
            }
          ],
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["last", "max"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "custom": { "lineWidth": 2 },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "red", "value": 0.01 }]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Total Request Rate",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=~\"retail-banking-team|payments-team|grc-team\"}[1m]))",
              "refId": "A"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }] }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Success Rate (2xx)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",response_code=~\"2..\",destination_service_namespace=~\"retail-banking-team|payments-team|grc-team\"}[1m])) / sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=~\"retail-banking-team|payments-team|grc-team\"}[1m])) * 100",
              "refId": "A"
            }
          ],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 90 }, { "color": "green", "value": 99 }] }
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Auth Errors (401 + 403)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",response_code=~\"401|403\"}[1m]))",
              "refId": "A"
            }
          ],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Active Services",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(sum by (destination_service_name) (rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=~\"retail-banking-team|payments-team|grc-team\"}[1m])) > 0)",
              "refId": "A"
            }
          ],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "P99 Request Latency per Service (ms)",
          "description": "99th percentile latency. High values indicate service overload — when combined with HPA this triggers scale-out.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 31 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\",destination_service_namespace=~\"retail-banking-team|payments-team|grc-team\"}[1m])) by (destination_service_name, le))",
              "legendFormat": "{{ destination_service_name }} p99",
              "refId": "A"
            }
          ],
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["last", "max"] }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2 }
            }
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: "/var/lib/grafana/dashboards/sessions.json"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboard-sessions
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboard-sessions
        configMap:
          name: grafana-dashboard-sessions
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
