# ---------------------------------------------------------------
# AuthorizationPolicy — retail-banking-team
# Strategy: deny-all by default, then explicit allows
#
# Principal format: cluster.local/ns/<namespace>/sa/<service-account>
#   cluster.local  → Istio trust domain (your cluster's identity domain)
#   ns/...         → Kubernetes namespace the workload runs in
#   sa/...         → Kubernetes ServiceAccount the pod uses
#   Full SPIFFE URI in the cert: spiffe://<principal>
#   Istio strips "spiffe://" automatically when matching.
# ---------------------------------------------------------------

# 1. Deny ALL traffic in retail-banking-team by default
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: retail-banking-deny-all
  namespace: retail-banking-team
spec: {}

---

# 2. Allow retail-banking IngressGateway → account-svc (container port 9092, service port 8082)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-account-svc
  namespace: retail-banking-team
spec:
  selector:
    matchLabels:
      app: account-svc
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        # SPIFFE identity of the IngressGateway pod:
        #   cluster.local  = trust domain
        #   ns/retail-banking-team = namespace where IngressGateway runs
        #   sa/retail-banking-istio-ingressgateway-service-account = its ServiceAccount
        - "cluster.local/ns/retail-banking-ingress/sa/retail-banking-istio-ingressgateway-service-account"
    to:
    - operation:
        ports: ["9092"]

---

# 5. Allow retail-banking IngressGateway → customer-profile-svc (container port 9091, service port 8081)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-customer-profile-svc
  namespace: retail-banking-team
spec:
