# ─────────────────────────────────────────────────────────────
# retail-banking-team
# Pods: customer-profile-svc (9091), account-svc (9092), statement-svc (9093)
# ─────────────────────────────────────────────────────────────

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-no-jwt-customer-profile-svc
  namespace: retail-banking-team
spec:
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            ports: ["9091"]

---

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-no-jwt-account-svc
  namespace: retail-banking-team
spec:
  selector:
    matchLabels:
      app: account-svc
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            ports: ["9092"]

---

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-no-jwt-statement-svc
  namespace: retail-banking-team
spec:
  selector:
    matchLabels:
      app: statement-svc
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            ports: ["9093"]

---

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-wrong-jwt-customer-profile-svc
  namespace: retail-banking-team
spec:
  selector:
    matchLabels:
      app: customer-profile-svc
  action: DENY
  rules:
    - from:
        - source:
            requestPrincipals:
              - "http://keycloak.hellocloud.io:8080/realms/hellocloudbank/*"
      when:
        - key: "request.auth.claims[groups]"
          notValues: ["retail-group"]
        - key: "request.auth.claims[preferred_username]"
          notValues: ["admin-user"]
      to:
        - operation:
            ports: ["9091"]

---

