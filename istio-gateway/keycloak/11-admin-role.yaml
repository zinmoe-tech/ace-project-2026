# ---------------------------------------------------------------
# AuthorizationPolicy — admin-user (full access to all namespaces)
# User: admin-user (preferred_username = admin-user)
#
# NOTE: The deny-wrong-jwt policies in 10-authz-policy-retail-group.yaml
# also exempt admin-user via notValues so DENY never fires for this user.
# ---------------------------------------------------------------

# ─────────────────────────────────────────────────────────────
# retail-banking-team
# ─────────────────────────────────────────────────────────────
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-admin-retail-banking
  namespace: retail-banking-team
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        requestPrincipals:
        - "http://keycloak.hellocloud.io:8080/realms/hellocloudbank/*"
    when:
    - key: "request.auth.claims[preferred_username]"
      values: ["admin-user"]

---

