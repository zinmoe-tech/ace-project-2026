# Allows the global HTTPRoute (in global-api-gateway-ns) to reference
# the retail-banking IngressGateway Service (now in retail-banking-ingress).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-global-httproute
  namespace: retail-banking-ingress
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: global-api-gateway-ns
  to:
  - group: ""
    kind: Service
    name: retail-banking-istio-ingressgateway
