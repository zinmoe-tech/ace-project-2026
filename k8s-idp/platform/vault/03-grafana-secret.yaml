# ═══════════════════════════════════════════════════════════════════════
# FILE: platform/vault/03-grafana-secret.yaml
#
# PURPOSE:
#   Syncs Vault path  secret/grafana  into a native Kubernetes Secret
#   named "grafana-admin" in the monitoring namespace.
#   kube-prometheus-stack's Grafana then reads it via admin.existingSecret.
#
#   Vault KV keys expected at secret/grafana:
#     admin-user, admin-password
# ═══════════════════════════════════════════════════════════════════════
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    managed-by: argocd
spec:
  type: kv-v2
  mount: secret                      # KV v2 mount in Vault
  path: grafana                      # secret/grafana
  refreshAfter: 30s                  # re-poll Vault every 30s
  destination:
    name: grafana-admin              # k8s Secret VSO will create
    create: true
  vaultAuthRef: vault/idp-auth       # cross-namespace ref to 02-vault-auth.yaml
