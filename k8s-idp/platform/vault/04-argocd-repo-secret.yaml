# ═══════════════════════════════════════════════════════════════════════
# FILE: platform/vault/04-argocd-repo-secret.yaml
#
# PURPOSE:
#   Syncs Vault path  secret/argocd  into the Kubernetes Secret
#   "repo-ace-project-2026" in the argocd namespace — replacing the
#   manually-created repo credential (and your skip-worktree PAT dance).
#
#   The label argocd.argoproj.io/secret-type=repository is what makes
#   Argo CD treat this Secret as a Git repository credential.
#
#   Vault KV keys expected at secret/argocd:
#     type, url, username, password
# ═══════════════════════════════════════════════════════════════════════
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: repo-ace-project-2026
  namespace: argocd
  labels:
    managed-by: argocd
spec:
  type: kv-v2
  mount: secret
  path: argocd                       # secret/argocd
  refreshAfter: 30s
  destination:
    name: repo-ace-project-2026      # k8s Secret VSO will create
    create: true
    labels:
      argocd.argoproj.io/secret-type: repository
  vaultAuthRef: vault/idp-auth       # cross-namespace ref to 02-vault-auth.yaml
