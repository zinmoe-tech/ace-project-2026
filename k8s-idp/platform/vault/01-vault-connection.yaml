# ═══════════════════════════════════════════════════════════════════════
# FILE: platform/vault/01-vault-connection.yaml
#
# PURPOSE:
#   Tells the Vault Secrets Operator (VSO) HOW to reach Vault.
#   Placed in the VSO operator namespace (vault). It is referenced
#   explicitly by name from the VaultAuth (02-vault-auth.yaml).
# ═══════════════════════════════════════════════════════════════════════
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: idp-vault
  namespace: vault
  labels:
    managed-by: argocd
spec:
  # In-cluster address of the Vault service (standalone + Raft, port 8200).
  address: http://vault.vault.svc.cluster.local:8200
