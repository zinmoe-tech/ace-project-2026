# Namespace that hosts the GLOBAL Istio ingress gateway pod (the external edge).
#
# NOTE: no `istio-injection: enabled` label here on purpose.
# This namespace holds an ingress gateway, not application workloads, so it must
# not get an app sidecar. The gateway pod itself is the Envoy proxy.
apiVersion: v1
kind: Namespace
metadata:
  name: global-istio-ingress
  labels:
    kubernetes.io/metadata.name: global-istio-ingress
