# Global routing table for the edge gateway.
#
# It takes the PUBLIC paths and forwards each one to the matching TEAM ingress
# gateway Service (the ClusterIP gateways from istio/minimal-profile.yaml),
# rewriting the public prefix to the internal path the team's own
# Gateway/VirtualService expects.
#
#   /retail-banking/customer-profile-svc  ->  rewrite /accounts      -> retail-banking ingress gw
#   /payments/transactions                ->  rewrite /transactions  -> payments ingress gw
#   /grc/audits                           ->  rewrite /audits        -> grc ingress gw
#
# Host header stays finance.hellocloud.io across both hops, so each team's own
# Gateway/VirtualService (which match on that host) still bind correctly.
#
# Flow:  user -> global-istio-gateway -> (this VS) -> team ingress gateway Service
#             -> team Gateway/VirtualService -> microservice
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: global-routes
  namespace: global-istio-ingress
spec:
  hosts:
  - finance.hellocloud.io
  gateways:
  - global-istio-ingress/global-istio-gateway
  http:
  - match:
    - uri:
        prefix: /retail-banking/customer-profile-svc
    rewrite:
      uri: /accounts
    route:
    - destination:
        host: retail-banking-istio-ingressgateway.retail-banking-ingress.svc.cluster.local
        port:
          number: 80

  - match:
    - uri:
        prefix: /payments/transactions
    rewrite:
      uri: /transactions
    route:
    - destination:
        host: payments-istio-ingressgateway.payments-ingress.svc.cluster.local
        port:
          number: 80

  - match:
    - uri:
        prefix: /grc/audits
    rewrite:
      uri: /audits
    route:
    - destination:
        host: grc-istio-ingressgateway.grc-ingress.svc.cluster.local
        port:
          number: 80
