#   # get/list/watch = read operations only. No create/update/delete.
#   - apiGroups: ["", "apps", "autoscaling", "networking.k8s.io", "batch"]
#     resources:
#       - pods
#       - pods/log                   # Can read logs but cannot exec
#       - deployments
#       - replicasets
#       - statefulsets
#       - services
#       - configmaps
#       - endpoints
#       - events
#       - horizontalpodautoscalers
#       - ingresses
#       - persistentvolumeclaims
#       - jobs
#       - cronjobs
#     verbs: ["get", "list", "watch"] # Read-only — no mutations allowed

