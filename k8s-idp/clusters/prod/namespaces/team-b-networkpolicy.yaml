# ═══════════════════════════════════════════════════════════════════════
# FILE: clusters/prod/namespaces/team-b-networkpolicy.yaml
#
# PURPOSE:
#   Identical network isolation strategy as team-a but scoped to team-b.
#   Each team has their own NetworkPolicy set so policies can be
#   independently tuned per team without affecting others.
#
#   Managed by: platform-namespaces ArgoCD Application
# ═══════════════════════════════════════════════════════════════════════

# ── Policy 1: Default deny ALL ingress and egress ───────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: team-b                # Scoped to team-b only
  labels:
    team: team-b
    managed-by: argocd

spec:
  podSelector: {}                  # Select ALL pods in team-b
  policyTypes:
    - Ingress                      # Block all incoming traffic
    - Egress                       # Block all outgoing traffic

---
# ── Policy 2: Allow intra-namespace traffic ──────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: team-b
  labels:
    team: team-b
    managed-by: argocd

spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector: {}          # Allow from team-b pods only

  egress:
    - to:
        - podSelector: {}          # Allow to team-b pods only

---
# ── Policy 3: Allow ingress from ingress-nginx ───────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: team-b
  labels:
    team: team-b
    managed-by: argocd

spec:
  podSelector: {}
  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000

---
# ── Policy 4: Allow egress to kube-dns ──────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: team-b
  labels:
    team: team-b
    managed-by: argocd

spec:
  podSelector: {}
  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53