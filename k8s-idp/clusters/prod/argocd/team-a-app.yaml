# ═══════════════════════════════════════════════════════════════════════
# FILE: clusters/prod/argocd/team-a-app.yaml
#
# PURPOSE:
#   Manages all Kubernetes workloads owned by team-a.
#   ArgoCD watches the apps/team-a/ folder and syncs whatever
#   the team commits there — Deployments, Services, HPAs, etc.
#
#   This is a TENANT-FACING Application. In a real platform:
#   - Platform team owns THIS file (the Application definition)
#   - Team-a owns the CONTENTS of apps/team-a/ (their workloads)
#
#   Isolation guarantee:
#   This Application deploys ONLY into the "team-a" namespace.
#   Team-a cannot affect any other namespace through this app.
#   In Phase 2 we enforce this at the AppProject level too.
#
#   Watches: apps/team-a/
# ═══════════════════════════════════════════════════════════════════════

apiVersion: argoproj.io/v1alpha1  # ArgoCD API group
kind: Application                  # ArgoCD Application custom resource
metadata:
  name: team-a-apps                # Name shown in ArgoCD UI — identifies tenant
  namespace: argocd                # All Application resources live in argocd namespace

  finalizers:
    # Prevents deletion of this Application while team-a's workloads
    # (Deployments, Services, etc.) are still running in the cluster.
    # Protects against accidental teardown of a live team's workloads.
    - resources-finalizer.argocd.argoproj.io

  labels:
    team: team-a                   # Optional label — useful for filtering
    tier: tenant                   # in the ArgoCD UI when you have many apps

spec:
  project: default                 # Will be changed to "team-a" in Phase 2
                                   # once we create the team-a AppProject with
                                   # namespace restrictions and resource blacklists.

  source:
    repoURL: https://github.com/zinmoe-tech/ace-project-2026.git  # Shared mono-repo
    targetRevision: HEAD           # Always track latest — team pushes trigger sync

    # ArgoCD watches this folder for team-a's workload manifests.
    # Currently contains: deployment.yaml, hpa.yaml,
    # networkpolicy.yaml, externalsecret.yaml (all empty for now —
    # we'll fill them in Phase 2 and beyond).
    path: k8s-idp/apps/team-a

  destination:
    server: https://kubernetes.default.svc  # Local cluster

    # IMPORTANT: team-a workloads deploy ONLY into this namespace.
    # Even if a manifest inside apps/team-a/ tries to target another
    # namespace, ArgoCD (and later the AppProject) will block it.
    namespace: team-a

  syncPolicy:
    automated:
      # prune: true → if team-a deletes deployment.yaml from their folder,
      # the Deployment is removed from the cluster automatically.
      # Prevents stale workloads accumulating over time.
      prune: true

      # selfHeal: true → if an SRE manually scales team-a's deployment
      # during an incident and forgets to revert, ArgoCD restores it
      # to the Git-defined replica count within 3 minutes.
      selfHeal: true

    syncOptions:
      # Create the team-a namespace if it doesn't exist yet.
      # In practice the platform-namespaces app creates it first,
      # but this acts as a safety net during bootstrapping.
      - CreateNamespace=true