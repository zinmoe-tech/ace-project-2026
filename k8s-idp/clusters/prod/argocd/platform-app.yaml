# ═══════════════════════════════════════════════════════════════════════
# FILE: clusters/prod/argocd/platform-app.yaml
#
# PURPOSE:
#   Manages cluster-wide platform infrastructure — specifically the
#   Namespace definitions, ResourceQuotas, and LimitRanges for all teams.
#
#   This is a PLATFORM-OWNED file. Only platform engineers should
#   modify it. Tenant teams (team-a, team-b) cannot create or modify
#   their own namespaces — the platform team provisions them centrally.
#
#   When you add a new team to the platform:
#     1. Add their Namespace + ResourceQuota + LimitRange to teams.yaml
#     2. Commit and push
#     3. ArgoCD auto-syncs — namespace appears in the cluster
#     No kubectl needed.
#
#   Watches: clusters/prod/namespaces/
# ═══════════════════════════════════════════════════════════════════════

apiVersion: argoproj.io/v1alpha1  # ArgoCD API group
kind: Application                  # ArgoCD Application custom resource
metadata:
  name: platform-namespaces        # Descriptive name — visible in ArgoCD UI
  namespace: argocd                # Must always be the argocd namespace

  finalizers:
    # Blocks deletion of this Application if managed resources still exist.
    # Prevents accidental namespace deletion by deleting this app.
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default                 # ArgoCD Project — will upgrade to "platform"
                                   # in Phase 2 when we add AppProject resources.

  source:
    repoURL: https://github.com/zinmoe-tech/ace-project-2026.git  # Your Git repo
    targetRevision: HEAD           # Track latest commit on default branch

    # Points to the namespaces folder which contains teams.yaml.
    # ArgoCD syncs everything in this folder — Namespaces,
    # ResourceQuotas, and LimitRanges all get applied together.
    path: k8s-idp/clusters/prod/namespaces

  destination:
    server: https://kubernetes.default.svc  # Deploy into the local cluster

    # Namespace resources are cluster-scoped so technically the
    # destination namespace doesn't matter for Namespace creation,
    # but ArgoCD requires this field. We use argocd as a convention.
    namespace: argocd

  syncPolicy:
    automated:
      # prune: true → removing a namespace entry from teams.yaml
      # will delete that Namespace from the cluster via ArgoCD.
      # WARNING: this also deletes all workloads inside that namespace.
      # Be very intentional when removing namespace entries.
      prune: true

      # selfHeal: true → if someone manually patches a ResourceQuota
      # (e.g. raises limits during an incident), ArgoCD reverts it.
      # All quota changes must go through Git for auditability.
      selfHeal: true

    syncOptions:
      # Allow ArgoCD to create namespaces it encounters during sync.
      # Needed here because ArgoCD itself may be in a freshly created ns.
      - CreateNamespace=true