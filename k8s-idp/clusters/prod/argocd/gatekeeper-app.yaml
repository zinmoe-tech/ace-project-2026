# ═══════════════════════════════════════════════════════════════════════
# FILE: clusters/prod/argocd/gatekeeper-app.yaml
#
# PURPOSE:
#   ArgoCD Application that syncs OPA Gatekeeper policies.
#   Syncs both ConstraintTemplates and Constraints from Git.
#
#   IMPORTANT: ConstraintTemplates must be applied BEFORE Constraints.
#   ArgoCD handles this automatically via sync waves — templates
#   get wave 1, constraints get wave 2.
# ═══════════════════════════════════════════════════════════════════════

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    tier: platform

spec:
  project: default

  source:
    repoURL: https://github.com/zinmoe-tech/ace-project-2026.git
    targetRevision: HEAD
    path: k8s-idp/platform/opa-gatekeeper            # syncs both templates/ and constraints/
    directory:
      recurse: true                                  # read the templates/ and contraints/ subfolders

  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Constraints reference CRDs that Gatekeeper only generates AFTER the
      # ConstraintTemplates are applied. Without this, Argo CD's up-front
      # dry-run rejects those not-yet-existing kinds and aborts the WHOLE
      # sync ("one or more synchronization tasks are not valid").
      - SkipDryRunOnMissingResource=true
    # Retry so the wave-2 Constraints reconcile once their CRDs exist.
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 2m