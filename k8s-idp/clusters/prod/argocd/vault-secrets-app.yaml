# ═══════════════════════════════════════════════════════════════════════
# FILE: clusters/prod/argocd/vault-secrets-app.yaml
#
# PURPOSE:
#   Child Application (auto-discovered by root-app) that syncs the VSO
#   custom resources under platform/vault/ — the VaultConnection,
#   VaultAuth, and the VaultStaticSecrets that materialize Vault data
#   into native Kubernetes Secrets (Grafana admin, Argo CD repo creds).
#
#   PREREQUISITE: Vault + Vault Secrets Operator must already be installed
#   (Helm) and Vault bootstrapped (init/unseal + KV/auth/role), because
#   this app applies VSO CRDs that the operator provides.
# ═══════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/zinmoe-tech/ace-project-2026.git
    targetRevision: HEAD
    path: k8s-idp/platform/vault         # VSO CRs live here

  destination:
    server: https://kubernetes.default.svc
    namespace: vault                     # nominal; manifests set their own ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
