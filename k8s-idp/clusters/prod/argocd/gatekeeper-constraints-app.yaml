# ═══════════════════════════════════════════════════════════════════════
# FILE: clusters/prod/argocd/gatekeeper-constraints-app.yaml
#
# PURPOSE:
#   Syncs the OPA Gatekeeper Constraints ONLY (the enforcement instances:
#   block-latest-tag, require-resource-limits, require-team-labels).
#
#   These depend on the CRDs generated by gatekeeper-templates (sync-wave
#   "1"). This app is sync-wave "2", so the app-of-apps (root-app) applies
#   and waits for gatekeeper-templates to be Healthy first. The CRDs then
#   exist by the time these constraints sync.
# ═══════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-constraints
  namespace: argocd
  annotations:
    # App-of-apps ordering: applied AFTER gatekeeper-templates (wave "1").
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    tier: platform

spec:
  project: default

  source:
    repoURL: https://github.com/zinmoe-tech/ace-project-2026.git
    targetRevision: HEAD
    path: k8s-idp/platform/opa-gatekeeper/contraints   # Constraints only (note: folder is "contraints")

  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Belt-and-suspenders: if a constraint CRD isn't registered yet on the
      # very first sync (Gatekeeper generates them a few seconds after the
      # templates apply), skip the dry-run instead of failing the whole sync.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 2m
