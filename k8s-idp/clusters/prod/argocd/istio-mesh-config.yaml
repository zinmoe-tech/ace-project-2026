apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-mesh-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zinmoe-tech/ace-project-2026.git
    targetRevision: HEAD
    path: k8s-idp/istio/mesh-config
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
