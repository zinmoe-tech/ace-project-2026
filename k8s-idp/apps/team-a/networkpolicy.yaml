# ═══════════════════════════════════════════════════════════════════════
# FILE: clusters/prod/namespaces/team-a-networkpolicy.yaml
#
# PURPOSE:
#   Enforces network isolation for the team-a namespace using Cilium.
#   Implements a "default deny all, explicit allow" model — the most
#   secure approach for multi-tenant platforms.
#
#   Rules applied:
#   1. Deny all ingress and egress by default
#   2. Allow intra-namespace traffic (team-a pods talk to each other)
#   3. Allow ingress from ingress-nginx (external traffic into team-a)
#   4. Allow egress to kube-dns (pods need DNS resolution)
#   5. Allow egress to kube-apiserver (needed by some workloads)
#
#   Cilium enforces these at the eBPF level — faster than iptables
#   and visible in the Hubble UI as allowed/dropped flows.
#
#   Managed by: platform-namespaces ArgoCD Application
# ═══════════════════════════════════════════════════════════════════════

# ── Policy 1: Default deny ALL ingress and egress ───────────────────
# This is the baseline. Without this, all other policies are additive
# on top of the default-allow behavior — which is insecure.
# With this, nothing flows unless explicitly permitted below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all           # Convention: always name it default-deny-all
  namespace: team-a                # Applies to ALL pods in team-a namespace
  labels:
    team: team-a
    managed-by: argocd

spec:
  podSelector: {}                  # Empty selector = select ALL pods in namespace
  policyTypes:
    - Ingress                      # Block all incoming traffic to team-a pods
    - Egress                       # Block all outgoing traffic from team-a pods
  # No ingress/egress rules defined here = deny everything by default

---
# ── Policy 2: Allow intra-namespace traffic ──────────────────────────
# Permits team-a pods to communicate with each other freely.
# Example: a frontend pod calling a backend pod in the same namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: team-a
  labels:
    team: team-a
    managed-by: argocd

spec:
  podSelector: {}                  # Applies to all pods in team-a

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector: {}          # Allow traffic FROM any pod in the same namespace
          # namespaceSelector is intentionally omitted here —
          # this means only pods in the SAME namespace (team-a) match.

  egress:
    - to:
        - podSelector: {}          # Allow traffic TO any pod in the same namespace

---
# ── Policy 3: Allow ingress from ingress-nginx ───────────────────────
# Permits the ingress-nginx controller to forward external HTTP/HTTPS
# traffic into team-a pods. Without this, ingress rules won't work
# even if they're correctly defined — traffic gets blocked here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: team-a
  labels:
    team: team-a
    managed-by: argocd

spec:
  podSelector: {}                  # Applies to all team-a pods

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # ingress-nginx namespace must have this label.
              # We'll add this label to the ingress-nginx namespace
              # when we install it in the next phase.
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080               # App port team-a pods listen on
        - protocol: TCP
          port: 3000               # Alternative app port

---
# ── Policy 4: Allow egress to kube-dns ──────────────────────────────
# ALL pods need DNS resolution to find other services by name.
# Without this, pods cannot resolve "my-service.team-a.svc.cluster.local"
# and all service-to-service calls fail with DNS lookup errors.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: team-a
  labels:
    team: team-a
    managed-by: argocd

spec:
  podSelector: {}                  # Applies to all team-a pods

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system  # kube-dns lives here
      ports:
        - protocol: UDP
          port: 53                 # DNS uses UDP port 53
        - protocol: TCP
          port: 53                 # DNS also uses TCP port 53 for large responses