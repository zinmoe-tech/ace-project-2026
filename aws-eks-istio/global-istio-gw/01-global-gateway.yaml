# The GLOBAL Istio Gateway — the single entry tier for the platform.
# Selects the global ingress gateway pod (from minimal-profile.yaml) and listens
# on plain HTTP :80 for grc.ky-cloud.click.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: global-istio-gateway
  namespace: global-istio-ingress
spec:
  selector:
    app: global-istio-ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - grc.ky-cloud.click