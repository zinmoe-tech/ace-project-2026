# grc DOMAIN gateway (TIER 2). Mirrors istio-gateway-cilium/domain-istio-gateway/grc/.
#
# Gateway lives in grc-ingress (same namespace as the grc ingress gateway pod).
# VirtualService lives in grc-ns (the workload namespace) and references the
# Gateway by full path <gateway-namespace>/<gateway-name>.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: grc-gateway
  namespace: grc-ingress
spec:
  selector:
    app: grc-istio-ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - grc.ky-cloud.click
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grc-routes
  namespace: grc-ns
spec:
  hosts:
  - grc.ky-cloud.click
  gateways:
  - grc-ingress/grc-gateway   # cross-namespace reference
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: fraud-svc.grc-ns.svc.cluster.local
        port:
          number: 6061