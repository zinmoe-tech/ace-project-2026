# Global routing table for the edge gateway (grc only).
#
# Takes the public path and forwards it to the grc TEAM ingress gateway Service
# (the ClusterIP gateway from minimal-profile.yaml), rewriting the public prefix
# to the internal path the grc Gateway/VirtualService expects.
#
#   /grc/audits  ->  rewrite /audits  -> grc ingress gw
#
# Host header stays finance.hellocloud.io across both hops, so grc's own
# Gateway/VirtualService (which match on that host) still bind correctly.
#
# Flow:  user -> NLB -> global-istio-gateway -> (this VS) -> grc ingress gw Service
#             -> grc Gateway/VirtualService -> fraud-svc
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: global-routes
  namespace: global-istio-ingress
spec:
  hosts:
  - finance.hellocloud.io
  gateways:
  - global-istio-ingress/global-istio-gateway
  http:
  - match:
    - uri:
        prefix: /grc/audits
    rewrite:
      uri: /audits
    route:
    - destination:
        host: grc-istio-ingressgateway.grc-ingress.svc.cluster.local
        port:
          number: 80