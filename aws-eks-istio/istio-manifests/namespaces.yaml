# Namespaces for the grc path on EKS.
# istioctl install does NOT create these automatically, so apply this file FIRST:
#   kubectl apply -f istio-manifests/namespaces.yaml
#
#   grc-ingress          -> hosts the grc Istio ingress gateway pod
#   grc-team             -> hosts the grc application workloads (fraud-svc)
#   global-istio-ingress -> hosts the single global edge gateway pod

apiVersion: v1
kind: Namespace
metadata:
  name: grc-ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: grc-team
---
apiVersion: v1
kind: Namespace
metadata:
  name: global-istio-ingress
  labels:
    kubernetes.io/metadata.name: global-istio-ingress