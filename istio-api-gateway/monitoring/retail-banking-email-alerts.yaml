apiVersion: v1
kind: ConfigMap
metadata:
  name: retail-alert-prometheus-config
  namespace: istio-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - retail-alertmanager.istio-system.svc.cluster.local:9093

    rule_files:
    - /etc/prometheus/rules.yml

    scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - action: keep
        regex: true
        source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_scrape
      - action: replace
        regex: (.+)
        source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_path
        target_label: __metrics_path__
      - action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        source_labels:
        - __address__
        - __meta_kubernetes_pod_annotation_prometheus_io_port
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - action: replace
        source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod

  rules.yml: |
    groups:
    - name: retail-banking-traffic
      rules:
      - alert: RetailBankingTrafficOver500
        expr: |
          sum(
            increase(
              istio_requests_total{
                reporter="destination",
                destination_service_name="customer-profile-svc",
                destination_workload_namespace="retail-banking-ns"
              }[5m]
            )
          ) > 500
        for: 1m
        labels:
          severity: warning
          service: retail-banking
        annotations:
          summary: "Retail banking service received more than 500 requests"
          description: "customer-profile-svc received more than 500 requests in the last 5 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-alert-prometheus
  namespace: istio-system
  labels:
    app: retail-alert-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retail-alert-prometheus
  template:
    metadata:
      labels:
        app: retail-alert-prometheus
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2d
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: retail-alert-prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: retail-alert-prometheus
  namespace: istio-system
spec:
  selector:
    app: retail-alert-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: retail-alertmanager
  namespace: istio-system
spec:
  selector:
    app: retail-alertmanager
  ports:
  - name: http
    port: 9093
    targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-alertmanager
  namespace: istio-system
  labels:
    app: retail-alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retail-alertmanager
  template:
    metadata:
      labels:
        app: retail-alertmanager
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - containerPort: 9093
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: data
          mountPath: /alertmanager
      volumes:
      - name: config
        secret:
          secretName: retail-alertmanager-config
      - name: data
        emptyDir: {}
